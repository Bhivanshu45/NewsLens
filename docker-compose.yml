services:
  postgres:
    image: postgres:16

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_news_db

    ports:
    - "5433:5432"
    
    volumes:
    - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7

    ports:
    - "6379:6379"

  qdrant:
    image: qdrant/qdrant

    ports:
    - "6333:6333"
    - "6334:6334"

    volumes:
    - qdrant_data:/qdrant/storage

volumes:
 postgres_data:
 qdrant_data: 
